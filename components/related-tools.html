// Function to populate related tools
function populateRelatedTools() {
  const container = document.getElementById('related-tools-container');
  if (!container) return;
  const category = getToolCategory();
  const relatedTools = toolCategories[category] || toolCategories['utility'];
  // Shuffle and take first 6 tools
  const shuffled = relatedTools.sort(() => 0.5 - Math.random());
  const selectedTools = shuffled.slice(0, 6);
  let html = '';
  selectedTools.forEach(tool => {
    html += `
      <div class="col-md-6 col-lg-4 mb-3">
        <a href="${tool.url}" class="text-decoration-none">
          <div class="card bg-dark border-danger h-100 tool-card">
            <div class="card-body text-center">
              <i class="bi ${tool.icon} text-danger fs-3 mb-2"></i>
              <h6 class="text-light mb-0">${tool.name}</h6>
            </div>
          </div>
        </a>
      </div>
    `;
  });
  container.innerHTML = html;
}

// Initialize related tools whether injected before or after DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', populateRelatedTools);
} else {
  populateRelatedTools();
}
