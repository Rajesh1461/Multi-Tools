// Function to get tool content based on current page
function getToolContent() {
  const currentPath = window.location.pathname;
  const fileName = currentPath.split('/').pop();
  return toolContent[fileName] || getDefaultContent();
}
// Default content for tools not in the database
function getDefaultContent() {
  return {
    description: `<p>This tool provides essential functionality for your online needs. It's designed to be user-friendly, fast, and reliable.</p><p><strong>Features:</strong></p><ul><li>Easy to use interface</li><li>Fast processing</li><li>No registration required</li><li>Free to use</li><li>Works on all devices</li></ul>`,
    usage: `<ol><li>Enter your data in the input fields</li><li>Configure any settings as needed</li><li>Click the process button</li><li>View your results</li><li>Download or copy the output</li></ol>`,
  };
}
// Function to populate content
function populateContent() {
    console.log('Content enhancer: Starting content population...');
    
    const content = getToolContent();
    console.log('Content enhancer: Retrieved content:', content);
    
    // Populate description
    const descriptionContainer = document.getElementById('tool-description');
    if (descriptionContainer) {
        descriptionContainer.innerHTML = content.description;
        console.log('Content enhancer: Description populated');
    } else {
        console.log('Content enhancer: Description container not found');
    }
    
    // Populate usage guide
    const usageContainer = document.getElementById('usage-guide');
    if (usageContainer) {
        usageContainer.innerHTML = content.usage;
        console.log('Content enhancer: Usage guide populated');
    } else {
        console.log('Content enhancer: Usage guide container not found');
    }
    
    // Populate FAQ section
    const faqContent = document.getElementById('faq-content');
    
    if (content.faq && content.faq.length > 0) {
        if (faqContent) {
            let faqHtml = '<div class="accordion" id="faqAccordion">';
            content.faq.forEach((item, index) => {
                const accordionId = `faq-${index}`;
                const collapseId = `collapse-${index}`;
                
                faqHtml += `
                    <div class="accordion-item bg-dark border-danger">
                        <h2 class="accordion-header" id="heading-${index}">
                            <button class="accordion-button collapsed bg-dark text-light border-danger" type="button" 
                                    data-bs-toggle="collapse" data-bs-target="#${collapseId}" 
                                    aria-expanded="false" aria-controls="${collapseId}">
                                ${item.question}
                            </button>
                        </h2>
                        <div id="${collapseId}" class="accordion-collapse collapse" 
                             aria-labelledby="heading-${index}" data-bs-parent="#faqAccordion">
                            <div class="accordion-body bg-dark text-light">
                                ${item.answer}
                            </div>
                        </div>
                    </div>
                `;
            });
            faqHtml += '</div>';
            
            faqContent.innerHTML = faqHtml;
            console.log('Content enhancer: FAQ populated');
        }
    }
    
}

// Initialize content whether injected before or after DOM is ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', populateContent);
} else {
    // If DOM is already loaded, wait a bit to ensure all elements are available
    setTimeout(populateContent, 100);
}

// Also try to populate when the component is loaded dynamically
window.addEventListener('load', populateContent);
</script>
