  <script>
    // Build the grid from sitemap entries that are under /tools/
    fetch('../sitemap.xml')
      .then(r => r.text())
      .then(xml => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'application/xml');
        const urls = Array.from(doc.querySelectorAll('url loc'))
          .map(n => n.textContent)
          .filter(u => /\/tools\/.+\.html$/.test(u));

        const grid = document.getElementById('toolsGrid');
        urls.sort();
        urls.forEach(href => {
          const name = href.split('/').pop().replace('.html','').replace(/-/g,' ');
          const card = document.createElement('div');
          card.className = 'card';
          const a = document.createElement('a');
          a.href = href.replace('https://multitoolszone.fun','');
          a.textContent = name.charAt(0).toUpperCase()+name.slice(1);
          
          // Add Ctrl+click functionality
          a.addEventListener('click', function(e) {
            // Check if Ctrl/Cmd key is pressed
            if (e.ctrlKey || e.metaKey) {
              e.preventDefault();
              // Open in new tab
              window.open(this.href, '_blank');
            }
            // If no modifier key, let the default behavior happen (same tab)
          });
          
          card.appendChild(a);
          grid.appendChild(card);
        });
      })
      .catch(() => {
        const grid = document.getElementById('toolsGrid');
        grid.innerHTML = '<p>Tools list will appear shortly.</p>';
      });
  </script>
