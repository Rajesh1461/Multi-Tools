<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Multi Tools logo">
  <defs>
    <linearGradient id="mtGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff4d5f"/>
      <stop offset="100%" stop-color="#dc3545"/>
    </linearGradient>
    
    <!-- Animation definitions -->
    <style>
      .gear-rotation {
        animation: rotate 8s linear infinite;
        transform-origin: 16px 16px;
      }
      
      .gear-notch {
        animation: pulse 2s ease-in-out infinite;
      }
      
      .gear-notch:nth-child(1) { animation-delay: 0s; }
      .gear-notch:nth-child(2) { animation-delay: 0.3s; }
      .gear-notch:nth-child(3) { animation-delay: 0.6s; }
      .gear-notch:nth-child(4) { animation-delay: 0.9s; }
      .gear-notch:nth-child(5) { animation-delay: 1.2s; }
      .gear-notch:nth-child(6) { animation-delay: 1.5s; }
      .gear-notch:nth-child(7) { animation-delay: 1.8s; }
      .gear-notch:nth-child(8) { animation-delay: 2.1s; }
      
      .mt-text {
        animation: glow 3s ease-in-out infinite alternate;
      }
      
      .logo-container {
        animation: float 4s ease-in-out infinite;
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      
      @keyframes glow {
        from { filter: drop-shadow(0 0 2px rgba(255,255,255,0.3)); }
        to { filter: drop-shadow(0 0 8px rgba(255,255,255,0.8)); }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      
      /* Hover effects */
      .logo-container:hover .gear-rotation {
        animation-duration: 2s;
      }
      
      .logo-container:hover .mt-text {
        animation-duration: 1s;
      }
    </style>
  </defs>
  
  <g class="logo-container">
    <rect width="48" height="48" rx="10" fill="#111"/>
    <g transform="translate(8,8)">
      <circle cx="16" cy="16" r="15" fill="url(#mtGradient)"/>
      
      <!-- Animated gear notches -->
      <g class="gear-rotation" fill="#c32535" opacity="0.9" transform="translate(16,16)">
        <rect class="gear-notch" x="-2" y="-16" width="4" height="5" rx="1"/>
        <rect class="gear-notch" x="-2" y="11" width="4" height="5" rx="1"/>
        <rect class="gear-notch" x="11" y="-2" width="5" height="4" rx="1"/>
        <rect class="gear-notch" x="-16" y="-2" width="5" height="4" rx="1"/>
        <rect class="gear-notch" x="9" y="9" width="4.5" height="3.5" rx="1" transform="rotate(45)"/>
        <rect class="gear-notch" x="-13.5" y="9" width="4.5" height="3.5" rx="1" transform="rotate(-45)"/>
        <rect class="gear-notch" x="9" y="-12.5" width="4.5" height="3.5" rx="1" transform="rotate(-45)"/>
        <rect class="gear-notch" x="-13.5" y="-12.5" width="4.5" height="3.5" rx="1" transform="rotate(45)"/>
      </g>
      
      <!-- Animated MT Monogram -->
      <g class="mt-text" fill="#ffffff" transform="translate(4,6)">
        <!-- M -->
        <path d="M0 16 V2 h3.2 l2.3 5.8 2.3-5.8 H11 V16 H8.2 V8.6 L5.8 14 H4.3 L2 8.6 V16 Z"/>
        <!-- T -->
        <path d="M13.5 2 H24 V5 H19.8 V16 H17.7 V5 H13.5 Z"/>
      </g>
    </g>
  </g>
</svg>


