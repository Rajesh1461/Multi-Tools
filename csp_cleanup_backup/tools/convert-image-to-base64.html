  <script>
    function convertImage() {
      const fileInput = document.getElementById('imageInput');
      const file = fileInput.files[0];
      
      if (!file) {
        alert('Please select an image file first.');
        return;
      }
      
      if (!file.type.startsWith('image/')) {
        alert('Please select a valid image file.');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        
        // Show preview
        document.getElementById('imagePreview').src = base64;
        document.getElementById('previewSection').style.display = 'block';
        
        // Show base64 output
        document.getElementById('base64Output').value = base64;
        document.getElementById('outputSection').style.display = 'block';
        
        // Show data URI
        document.getElementById('dataUriOutput').value = base64;
        document.getElementById('dataUriSection').style.display = 'block';
      };
      
      reader.readAsDataURL(file);
    }
    
    function clearAll() {
      document.getElementById('imageInput').value = '';
      document.getElementById('previewSection').style.display = 'none';
      document.getElementById('outputSection').style.display = 'none';
      document.getElementById('dataUriSection').style.display = 'none';
    }
    
    function copyToClipboard() {
      const base64Output = document.getElementById('base64Output');
      base64Output.select();
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(base64Output.value).then(() => {
            alert('Base64 string copied to clipboard!');
          }).catch(() => {
            document.execCommand('copy');
            alert('Base64 string copied to clipboard!');
          });
        } else {
          document.execCommand('copy');
          alert('Base64 string copied to clipboard!');
        }
      } catch (err) {
        console.error('Failed to copy: ', err);
        alert('Failed to copy to clipboard. Please select and copy manually.');
      }
    }
    
    function copyDataUri() {
      const dataUriOutput = document.getElementById('dataUriOutput');
      dataUriOutput.select();
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(dataUriOutput.value).then(() => {
            alert('Data URI copied to clipboard!');
          }).catch(() => {
            document.execCommand('copy');
            alert('Data URI copied to clipboard!');
          });
        } else {
          document.execCommand('copy');
          alert('Data URI copied to clipboard!');
        }
      } catch (err) {
        console.error('Failed to copy: ', err);
        alert('Failed to copy to clipboard. Please select and copy manually.');
      }
    }
    
    function downloadBase64() {
      const base64Output = document.getElementById('base64Output');
      const blob = new Blob([base64Output.value], { type: 'text/plain' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'image-base64.txt';
      a.click();
      window.URL.revokeObjectURL(url);
    }
  </script>
